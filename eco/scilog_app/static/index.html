<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SciLog viewer</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header id="bar">
  <button id="toggle-outline" title="Outline (o)" aria-label="Outline">&#9776;</button>
  <button id="logbook-button" title="Choose a logbook (l)"><span id="logbook-name">Choose a logbook</span> &#9662;</button>
  <div id="search-wrap">
    <input id="search" type="search" placeholder="Search this logbook  ( / )" autocomplete="off" spellcheck="false">
    <div id="results" hidden></div>
  </div>
  <select id="view" title="Which posts to show (v)" hidden></select>
  <button id="new-post" title="Write a new post (n)" hidden>&#10010; New post</button>
  <a id="scilog-link" target="_blank" rel="noopener" title="This logbook in SciLog" hidden>SciLog &#8599;</a>
  <span id="status"></span>
</header>

<div id="picker" hidden>
  <input id="picker-filter" type="search" placeholder="Filter logbooks by name, pgroup or location" autocomplete="off">
  <ol id="picker-list"></ol>
</div>

<div id="layout">
  <nav id="outline" aria-label="Outline">
    <div id="pane-tabs" role="tablist">
      <button data-pane="outline" class="active" title="Days, posts and headings">Outline</button>
      <button data-pane="map" title="The flow drawn small: figures, tables and lists by their look (m)">Map</button>
    </div>
    <div id="outline-tree"></div>
    <div id="map" hidden></div>
  </nav>
  <main id="flow" tabindex="-1">
    <p class="hint">Loading ...</p>
  </main>
</div>
<div id="day-banner" aria-hidden="true"></div>
<div id="only-banner" hidden></div>
<button id="to-bottom" title="To the newest post (End)" hidden>&#8595; Newest</button>
<div id="toast" role="status" hidden></div>
<script src="/static/app.js"></script>
<script src="/static/editor.js"></script>
<script src="/static/map.js"></script>
<script src="/static/views.js"></script>
</body>
</html>
