<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SciLog viewer</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header id="bar">
  <button id="toggle-outline" title="Outline (o)" aria-label="Outline">&#9776;</button>
  <button id="logbook-button" title="Choose a logbook (l)"><span id="logbook-name">Choose a logbook</span> &#9662;</button>
  <button id="search-button" title="Search this logbook" aria-label="Search">&#128269;</button>
  <div id="search-wrap">
    <input id="search" type="search" placeholder="Search this logbook  ( / )" autocomplete="off" spellcheck="false" enterkeyhint="search">
    <button id="search-cancel" type="button">Cancel</button>
    <div id="results" hidden></div>
  </div>
  <select id="view" title="Which posts to show (v)" aria-label="Which posts to show" hidden></select>
  <button id="views-button" title="SciLog's own views of this logbook: list, compare, rename, change, delete" hidden>&#9881;<span class="lbl"> SciLog views</span></button>
  <button id="new-post" title="Write a new post (n)" hidden>&#10010; New post</button>
  <a id="scilog-link" target="_blank" rel="noopener" title="This logbook in SciLog" hidden>SciLog &#8599;</a>
  <span id="status"></span>
</header>

<div id="picker" hidden>
  <input id="picker-filter" type="search" placeholder="Filter logbooks by name, pgroup or location" autocomplete="off">
  <ol id="picker-list"></ol>
</div>

<div id="layout">
  <nav id="outline" aria-label="Outline">
    <div id="pane-tabs" role="tablist">
      <button data-pane="headings" class="active" title="The headings of all posts as one table of contents, with the days (h)">Outline</button>
      <button data-pane="outline" title="Every post by month and day, with its headings (s)">Stream</button>
      <button data-pane="map" title="The flow drawn small: figures, tables and lists by their look (m)">Map</button>
    </div>
    <div id="headings"></div>
    <div id="outline-tree" hidden></div>
    <div id="map" hidden></div>
  </nav>
  <div id="pane-resizer" role="separator" aria-orientation="vertical" title="Drag to resize · double-click: default width"></div>
  <main id="flow" tabindex="-1">
    <p class="hint">Loading ...</p>
  </main>
</div>
<aside id="pin-pane" hidden aria-label="Pinned">
  <div id="pin-resizer" role="separator" aria-orientation="vertical" title="Drag to resize · double-click: default width"></div>
  <div id="pin-head"></div>
  <div id="pin-flow" tabindex="-1"></div>
</aside>
<div id="day-banner" aria-hidden="true"></div>
<div id="only-banner" hidden></div>
<button id="to-bottom" title="To the newest post (End)" hidden>&#8595; Newest</button>
<div id="toast" role="status" hidden></div>
<script src="/static/app.js"></script>
<script src="/static/editor.js"></script>
<script src="/static/map.js"></script>
<script src="/static/views.js"></script>
<script src="/static/pin.js"></script>
<script src="/static/headings.js"></script>
<script src="/static/postmenu.js"></script>
</body>
</html>
