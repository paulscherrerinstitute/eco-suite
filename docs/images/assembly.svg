<?xml version="1.0" encoding="UTF-8"?>
<!--
  "Representation of devices - Assembly" - after the eco intro slide.
  One Assembly (a bag of Adjustable/Detector elements) represents one physical
  Device, reaching it through whatever mix of interfaces it needs: EPICS, a
  data stream, the file system. Edit freely.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="440" rx="10" fill="#ffffff" stroke="#d0d7de"/>

  <!-- control environment -->
  <rect x="30" y="40" width="230" height="360" rx="14" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="48" y="66" font-size="13" font-weight="700" fill="#1a1a1a">Experiment control</text>
  <text x="48" y="83" font-size="13" font-weight="700" fill="#1a1a1a">environment</text>

  <!-- assembly -->
  <rect x="70" y="110" width="150" height="250" rx="12" fill="#e8f2fb" stroke="#0071bc" stroke-width="1.5"/>
  <text x="145" y="135" text-anchor="middle" font-size="14" font-weight="700" fill="#0071bc">Assembly</text>
  <g stroke-linejoin="round" stroke-width="1.5">
    <polygon points="92,189 136,189 136,173.7 114,155 92,173.7" fill="#d62828" stroke="#8a1a1a"/>
    <polygon points="150,189 194,189 194,173.7 172,155 150,173.7" fill="#d62828" stroke="#8a1a1a"/>
    <polygon points="92,234 136,234 136,218.7 114,200 92,218.7" fill="#d62828" stroke="#8a1a1a"/>
    <path d="M150,200 H177 A17,17 0 0 1 177,234 H150 Z" fill="#1d4ed8" stroke="#122f80"/>
    <polygon points="103,250 133,250 138,268 128,286 108,286 98,268" fill="#7cb342" stroke="#4e7a21"/>
  </g>

  <!-- interfaces -->
  <g>
    <rect x="360" y="70" width="120" height="46" rx="8" fill="#f6dfe8" stroke="#c98aa6"/>
    <text x="420" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#7a3350">EPICS</text>

    <rect x="360" y="190" width="120" height="46" rx="8" fill="#efeafc" stroke="#8a63c9"/>
    <text x="420" y="218" text-anchor="middle" font-size="13" font-weight="700" fill="#5b3f8a">Data</text>

    <rect x="360" y="310" width="120" height="46" rx="8" fill="#e5e7eb" stroke="#6b7280"/>
    <text x="420" y="332" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">File system</text>
  </g>

  <!-- assembly -> interfaces (fan out) -->
  <g stroke="#1a1a1a" fill="none" stroke-width="1.2">
    <path d="M220,210 C300,150 320,100 360,93"/>
    <path d="M220,225 C300,225 330,213 360,213"/>
    <path d="M220,240 C300,300 320,330 360,333"/>
  </g>

  <!-- device box (dashed) -->
  <rect x="600" y="50" width="250" height="340" rx="10" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="618" y="74" font-size="13" font-weight="700" fill="#1a1a1a">Device</text>

  <!-- device hardware -->
  <circle cx="660" cy="120" r="20" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="660" y="125" text-anchor="middle" font-size="13" font-weight="700">M</text>
  <circle cx="720" cy="120" r="20" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="720" y="125" text-anchor="middle" font-size="13" font-weight="700">M</text>
  <rect x="640" y="170" width="40" height="36" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="660" cy="188" r="11" fill="none" stroke="#1a1a1a"/>
  <rect x="700" y="170" width="40" height="36" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="720" cy="188" r="11" fill="none" stroke="#1a1a1a"/>
  <!-- amplifier feeding a photodiode -->
  <polygon points="650,240 685,262 650,284" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M700,251 L700,273 L716,262 Z" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M716,249 L716,275" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M685,262 L700,262 M716,262 L730,262" stroke="#1a1a1a" stroke-width="1.3"/>
  <g>
    <rect x="650" y="315" width="34" height="44" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
    <path d="M657,326 h20 M657,334 h20 M657,342 h14" stroke="#1a1a1a"/>
  </g>

  <!-- interfaces -> device -->
  <g stroke="#1a1a1a" fill="none" stroke-width="1.2">
    <path d="M480,93 C540,93 560,120 640,120"/>
    <path d="M480,100 C540,140 560,188 640,188"/>
    <path d="M480,213 C540,213 560,262 650,262"/>
    <path d="M480,333 C540,333 560,337 650,337"/>
  </g>
</svg>
