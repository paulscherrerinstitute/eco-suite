<?xml version="1.0" encoding="UTF-8"?>
<!--
  "Why an experiment control interface?" - after the eco intro slides.
  eco sits below the main SwissFEL systems and ties them together, while also
  talking to elog, archives and the configuration store. Edit boxes/labels
  freely; all shapes are plain <rect>/<text>.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="540" rx="10" fill="#ffffff" stroke="#d0d7de"/>

  <!-- top: detectors and devices -->
  <g font-size="12">
    <rect x="70" y="40" width="110" height="34" rx="4" fill="#f3f4f6" stroke="#6b7280"/>
    <text x="125" y="62" text-anchor="middle" fill="#1a1a1a">Detector 1</text>
    <rect x="185" y="40" width="110" height="34" rx="4" fill="#f3f4f6" stroke="#6b7280"/>
    <text x="240" y="62" text-anchor="middle" fill="#1a1a1a">Detector 2</text>
    <rect x="300" y="40" width="110" height="34" rx="4" fill="#f3f4f6" stroke="#6b7280"/>
    <text x="355" y="62" text-anchor="middle" fill="#1a1a1a">Detector 3</text>

    <rect x="470" y="40" width="110" height="34" rx="4" fill="#f3f4f6" stroke="#6b7280"/>
    <text x="525" y="62" text-anchor="middle" fill="#1a1a1a">Device 1</text>
    <rect x="585" y="40" width="110" height="34" rx="4" fill="#f3f4f6" stroke="#6b7280"/>
    <text x="640" y="62" text-anchor="middle" fill="#1a1a1a">Device 2</text>
    <rect x="700" y="40" width="110" height="34" rx="4" fill="#f3f4f6" stroke="#6b7280"/>
    <text x="755" y="62" text-anchor="middle" fill="#1a1a1a">Device 3</text>
  </g>

  <!-- systems row -->
  <g font-size="13">
    <rect x="70" y="120" width="150" height="70" rx="8" fill="#e9f6ee" stroke="#2e8b57" stroke-width="1.5"/>
    <text x="145" y="150" text-anchor="middle" fill="#1a1a1a">Analysis</text>
    <text x="145" y="168" text-anchor="middle" fill="#1a1a1a">pipeline</text>

    <rect x="245" y="120" width="150" height="70" rx="8" fill="#e9f6ee" stroke="#2e8b57" stroke-width="1.5"/>
    <text x="320" y="150" text-anchor="middle" fill="#1a1a1a">DAQ control</text>

    <rect x="500" y="120" width="180" height="70" rx="8" fill="#e8f2fb" stroke="#0071bc" stroke-width="1.5"/>
    <text x="590" y="150" text-anchor="middle" fill="#1a1a1a">EPICS CA</text>
    <text x="590" y="168" text-anchor="middle" fill="#1a1a1a">network</text>
  </g>

  <!-- main SwissFEL infrastructure brace label -->
  <text x="820" y="120" font-size="12" fill="#4a5b6b">Main SwissFEL</text>
  <text x="820" y="136" font-size="12" fill="#4a5b6b">infrastructure</text>
  <path d="M812,90 q8,0 8,10 v70 q0,10 8,10 q-8,0 -8,10 v70 q0,10 -8,10" fill="none" stroke="#9aa5b1"/>

  <!-- eco box -->
  <rect x="330" y="300" width="200" height="80" rx="10" fill="#fdf0e6" stroke="#d64545" stroke-width="2.5"/>
  <text x="430" y="330" text-anchor="middle" font-size="15" font-weight="700" fill="#b5341f">Experiment control</text>
  <text x="430" y="352" text-anchor="middle" font-size="15" font-weight="700" fill="#b5341f">interface  (eco)</text>

  <!-- side stores -->
  <g font-size="12">
    <rect x="60" y="290" width="180" height="34" rx="4" fill="#f3f4f6" stroke="#6b7280"/>
    <text x="150" y="312" text-anchor="middle" fill="#1a1a1a">Elog / Data catalog</text>
    <rect x="60" y="330" width="180" height="34" rx="4" fill="#f3f4f6" stroke="#6b7280"/>
    <text x="150" y="352" text-anchor="middle" fill="#1a1a1a">Archive(s)</text>
    <rect x="60" y="370" width="180" height="34" rx="4" fill="#f3f4f6" stroke="#6b7280"/>
    <text x="150" y="392" text-anchor="middle" fill="#1a1a1a">Configuration archive</text>
  </g>

  <!-- connectors: detectors/devices -> systems -->
  <g stroke="#9b59b6" fill="none" stroke-width="1.3">
    <path d="M125,74 C140,100 145,100 145,120"/>
    <path d="M240,74 C220,100 160,100 150,120"/>
    <path d="M355,74 C345,100 330,100 322,120"/>
    <path d="M525,74 C560,100 585,100 588,120"/>
    <path d="M640,74 C620,100 595,100 592,120"/>
    <path d="M755,74 C720,100 600,100 594,120"/>
  </g>
  <!-- systems -> eco -->
  <g stroke="#9b59b6" fill="none" stroke-width="1.3">
    <path d="M145,190 C160,250 340,250 360,300"/>
    <path d="M320,190 C320,250 400,255 410,300"/>
    <path d="M590,190 C590,250 480,255 470,300"/>
  </g>
  <!-- eco -> stores -->
  <g stroke="#9b59b6" fill="none" stroke-width="1.3">
    <path d="M330,330 C280,330 250,310 240,307"/>
    <path d="M330,345 C285,347 250,347 240,347"/>
    <path d="M330,360 C285,365 250,385 240,387"/>
  </g>

  <!-- algorithms/toolbase -->
  <rect x="60" y="440" width="620" height="56" rx="8" fill="#e5e7eb" stroke="#6b7280"/>
  <text x="80" y="468" font-size="13" font-weight="700" fill="#1a1a1a">Algorithms &amp; toolbase</text>
  <text x="80" y="486" font-size="11" fill="#4a5b6b">specific + generic computing, plotting, interfaces to devices and files, …</text>
  <path d="M430,380 L430,440" stroke="#d64545" stroke-width="2" marker-end="url(#redarr)"/>
  <defs>
    <marker id="redarr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#d64545"/>
    </marker>
  </defs>

  <!-- takeaways -->
  <g font-size="12" fill="#1a1a1a">
    <text x="710" y="300" font-weight="700" fill="#0f2b45">A tool to…</text>
    <text x="710" y="326">· “talk” to all devices</text>
    <text x="710" y="348">· employ existing algorithms</text>
    <text x="710" y="370">· be automated by all staff</text>
  </g>
</svg>
