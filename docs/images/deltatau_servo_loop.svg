<?xml version="1.0" encoding="UTF-8"?>
<!--
  Didactic redraw of the Power PMAC position servo loop (PID + feedforward),
  after the block diagram in the Omron Power PMAC User's Manual (O014),
  "Servo Loop" chapter. Not a copy of the manual figure — simplified to the
  parameters the bernina configs actually set. Edit freely.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arrowblue" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#0071bc"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="940" height="430" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="28" y="34" font-size="15" font-weight="700" fill="#1a1a1a">Power PMAC position servo loop (per motor)</text>

  <!-- trajectory generator -->
  <rect x="26" y="150" width="150" height="70" rx="10" fill="#e8f2fb" stroke="#0071bc" stroke-width="1.5"/>
  <text x="101" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#0071bc">Trajectory</text>
  <text x="101" y="199" text-anchor="middle" font-size="11" fill="#0071bc">commanded pos.</text>
  <text x="101" y="213" text-anchor="middle" font-size="11" fill="#0071bc">JogSpeed / JogTa</text>

  <!-- summing junction -->
  <circle cx="243" cy="185" r="19" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="243" y="190" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">+</text>
  <text x="243" y="214" text-anchor="middle" font-size="14" font-weight="700" fill="#d62828">&#8722;</text>
  <line x1="176" y1="185" x2="222" y2="185" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- following error label -->
  <line x1="262" y1="185" x2="330" y2="185" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="296" y="164" text-anchor="middle" font-size="11" font-style="italic" fill="#1a1a1a">following</text>
  <text x="296" y="176" text-anchor="middle" font-size="11" font-style="italic" fill="#1a1a1a">error</text>

  <!-- PID block -->
  <rect x="332" y="150" width="150" height="70" rx="10" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="407" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">PID controller</text>
  <text x="407" y="196" text-anchor="middle" font-size="11" fill="#1a1a1a">Kp &#183; Ki &#183; Kd</text>
  <text x="407" y="211" text-anchor="middle" font-size="10" fill="#6b7280">MaxPosErr / MaxInt clamp</text>

  <!-- feedforward block -->
  <rect x="332" y="52" width="150" height="62" rx="10" fill="#eef7ee" stroke="#4e7a21" stroke-width="1.5"/>
  <text x="407" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#4e7a21">Feed-forward</text>
  <text x="407" y="98" text-anchor="middle" font-size="11" fill="#4e7a21">Kvff (vel) &#183; Kaff (acc)</text>
  <!-- trajectory feeds FF -->
  <path d="M101,150 L101,83 L332,83" fill="none" stroke="#4e7a21" stroke-width="1.4" marker-end="url(#arrow)" stroke-dasharray="4 3"/>
  <text x="150" y="76" font-size="10" fill="#4e7a21">vel / accel</text>

  <!-- second summing junction (PID + FF) -->
  <circle cx="560" cy="185" r="19" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="560" y="190" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">+</text>
  <line x1="482" y1="185" x2="539" y2="185" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M482,83 L560,83 L560,164" fill="none" stroke="#4e7a21" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- amplifier / current loop -->
  <line x1="579" y1="185" x2="622" y2="185" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="600" y="176" text-anchor="middle" font-size="10" fill="#6b7280">command</text>
  <rect x="624" y="150" width="130" height="70" rx="10" fill="#fbeaea" stroke="#8a1a1a" stroke-width="1.5"/>
  <text x="689" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#8a1a1a">Amplifier /</text>
  <text x="689" y="198" text-anchor="middle" font-size="13" font-weight="700" fill="#8a1a1a">current loop</text>
  <text x="689" y="213" text-anchor="middle" font-size="10" fill="#8a1a1a">dirCur / holding</text>

  <!-- motor + encoder -->
  <line x1="754" y1="185" x2="792" y2="185" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="794" y="150" width="118" height="70" rx="10" fill="#eef1f5" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="853" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">Motor</text>
  <text x="853" y="198" text-anchor="middle" font-size="11" fill="#1a1a1a">+ encoder</text>
  <text x="853" y="212" text-anchor="middle" font-size="10" fill="#6b7280">posSf / servoSf</text>

  <!-- feedback path -->
  <path d="M853,220 L853,300 L243,300 L243,204" fill="none" stroke="#0071bc" stroke-width="1.6" marker-end="url(#arrowblue)"/>
  <text x="548" y="316" text-anchor="middle" font-size="11" fill="#0071bc">measured position feedback (encoder counts &#8594; user units)</text>

  <!-- following-error monitor tap -->
  <path d="M296,204 L296,360 L470,360" fill="none" stroke="#b45309" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <rect x="472" y="338" width="240" height="46" rx="9" fill="#fff7e6" stroke="#b45309" stroke-width="1.4"/>
  <text x="592" y="358" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">Following-error monitor</text>
  <text x="592" y="374" text-anchor="middle" font-size="10" fill="#b45309">InPosBand &#183; WarnFeLimit &#183; FatalFeLimit</text>
</svg>
